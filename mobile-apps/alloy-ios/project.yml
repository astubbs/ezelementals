name: Alloy
options:
  bundleIdPrefix: com.sharca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Alloy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Alloy
    info:
      path: Alloy/Info.plist
      properties:
        CFBundleDisplayName: Alloy
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Alloy finds your AV receiver on your local network.
        NSBonjourServices:
          - _home-assistant._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharca.alloy
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"

  AlloyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlloyTests
    dependencies:
      - target: Alloy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharca.alloy.tests

  AlloyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlloyUITests
    dependencies:
      - target: Alloy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharca.alloy.uitests

schemes:
  Alloy:
    build:
      targets:
        Alloy: all
        AlloyTests: [test]
        AlloyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlloyTests
        - AlloyUITests
    archive:
      config: Release
