name: alloy-ios CI

# Disabled: simulator destination + Xcode version on the runner need
# fixing. Will be brought in from the mobile-apps branch.
# To re-enable, remove the `if: false` on the job below and update
# the Xcode version + destination to match the runner.

on:
  push:
    branches: [main]
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"

defaults:
  run:
    working-directory: mobile-apps/alloy-ios

jobs:
  test:
    if: false  # disabled until mobile-apps branch lands the fix
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alloy.xcodeproj \
            -scheme Alloy \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
