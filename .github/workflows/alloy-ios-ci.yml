name: alloy-ios CI

on:
  push:
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"
  pull_request:
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-apps/alloy-ios

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alloy.xcodeproj \
            -scheme Alloy \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  # Aggregator for branch protection. Always runs when this
  # workflow triggers. If path filter excludes the PR, this
  # workflow doesn't run at all — which is the desired behaviour
  # for monorepo required checks.
  ci-status:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "alloy-ios CI: ok"
