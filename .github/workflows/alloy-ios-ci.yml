name: alloy-ios CI

on:
  push:
    branches: [main]
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-apps/alloy-ios/**"
      - "mobile-apps/specs/**"
      - ".github/workflows/alloy-ios-ci.yml"

defaults:
  run:
    working-directory: mobile-apps/alloy-ios

jobs:
  test:
    # macos-15 ships Xcode 16.x. The Alloy project.yml was generated by a
    # newer Xcode that writes project format 77, which Xcode 15.4 on
    # macos-14 rejects with "future project file format".
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alloy.xcodeproj \
            -scheme Alloy \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
